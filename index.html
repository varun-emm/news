<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Swipe</title>
<meta name="description" content="Varun's daily news deck: world, India and the money desk, in swipeable cards.">
<meta name="theme-color" content="#0b0b0f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23ff5a36'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='900'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0f; --fg:#f5f5f7; --muted:#a1a1aa; --chip:#1c1c22; --chip-on:#f5f5f7; --chip-on-fg:#0b0b0f;
  --sheet:#141418; --line:#2a2a31;
  --accent:#ff5a36;
}
:root[data-theme="light"]{
  --bg:#f4f1ec; --fg:#141414; --muted:#5f5f66; --chip:#e6e1d9; --chip-on:#141414; --chip-on-fg:#fff;
  --sheet:#ffffff; --line:#e3ded6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* Top bar */
header{padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;align-items:center;gap:12px}
.brand{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;box-shadow:0 0 12px var(--accent)}
.date{color:var(--muted);font-size:13px;font-weight:500}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

nav{display:flex;gap:8px;padding:4px 16px 10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600;white-space:nowrap;transition:.2s}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
.chip small{opacity:.6;font-weight:500;margin-left:4px}

/* Deck */
main{flex:1;position:relative;margin:0 auto;width:100%;max-width:520px;padding:0 16px}
.deck{position:relative;height:100%;}
.card{position:absolute;inset:0 0 8px 0;border-radius:28px;overflow:hidden;background:var(--c);
  box-shadow:0 20px 50px -20px rgba(0,0,0,.6);touch-action:pan-y;user-select:none;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;will-change:transform;cursor:pointer}
.card.behind{transform:scale(.94) translateY(14px);opacity:.55;pointer-events:none}
.card.behind2{transform:scale(.88) translateY(28px);opacity:.25;pointer-events:none}
.card.hidden{opacity:0;pointer-events:none;transform:scale(.85)}
.card.dragging{transition:none}
.card .img{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.04)}
.card .fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:140px;
  background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c) 40%,white),var(--c) 60%,color-mix(in srgb,var(--c) 60%,black))}
.card .shade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 22%,transparent 38%,color-mix(in srgb,var(--c) 70%,transparent) 62%,var(--c) 82%)}
.card .top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.pill.stat{text-transform:none;letter-spacing:0;font-size:13px}
.card .bottom{position:absolute;left:0;right:0;bottom:0;padding:22px 22px 24px;color:#fff}
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85;display:flex;gap:8px;align-items:center}
.kicker .em{font-size:18px}
.card h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(26px,7.4vw,34px);line-height:1.08;letter-spacing:-.02em;margin:8px 0 10px;text-wrap:balance}
.card p.dek{margin:0;font-size:15.5px;line-height:1.45;opacity:.95;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .hint{margin-top:14px;font-size:12px;font-weight:600;opacity:.75;display:flex;align-items:center;gap:6px}
.credit{position:absolute;right:14px;top:56px;font-size:10px;color:rgba(255,255,255,.7);text-decoration:none;background:rgba(0,0,0,.3);padding:3px 7px;border-radius:6px}

/* swipe stamps */
.stamp{position:absolute;top:50%;font-weight:800;font-size:13px;letter-spacing:.1em;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.5);color:#fff;opacity:0;transition:opacity .1s}
.stamp.l{left:16px}.stamp.r{right:16px}

/* progress + controls */
footer{padding:6px 16px calc(env(safe-area-inset-bottom) + 12px);display:flex;align-items:center;gap:12px;max-width:520px;margin:0 auto;width:100%}
.dots{flex:1;display:flex;gap:4px}
.dots span{flex:1;height:4px;border-radius:4px;background:var(--line);transition:.3s}
.dots span.on{background:var(--fg)}
.dots span.seen{background:var(--muted)}
.nav-btn{width:44px;height:44px;border-radius:50%;background:var(--chip);display:grid;place-items:center}
.nav-btn svg{width:20px;height:20px}
.count{font-size:12px;color:var(--muted);font-weight:600;min-width:38px;text-align:center}

/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92dvh;background:var(--sheet);border-radius:28px 28px 0 0;
  transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:21;overflow:hidden;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .hero{position:relative;height:220px;flex:none;background:var(--c) center/cover}
.sheet .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,var(--sheet))}
.sheet .close{position:absolute;top:14px;right:14px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
.sheet .grab{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:44px;height:5px;border-radius:5px;background:rgba(255,255,255,.7);z-index:2}
.sheet .content{overflow-y:auto;padding:0 22px calc(env(safe-area-inset-bottom) + 28px);margin-top:-40px;position:relative;z-index:1}
.sheet .kicker{color:var(--c2)}
.sheet h3{font-family:Fraunces,Georgia,serif;font-size:28px;line-height:1.12;margin:8px 0 16px;letter-spacing:-.02em}
.statbox{display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:18px;padding:14px 16px;margin-bottom:18px}
.statbox b{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--c2);white-space:nowrap}
.statbox span{font-size:13px;color:var(--muted);line-height:1.3}
.sheet ul.body{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:12px}
.sheet ul.body li{font-size:16px;line-height:1.5;padding-left:18px;position:relative}
.sheet ul.body li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--c2)}
.box{border-radius:18px;padding:14px 16px;margin-bottom:12px;font-size:15px;line-height:1.5}
.box h4{margin:0 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.box.joke{background:var(--chip);font-style:italic}
.box.vc{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,transparent),transparent);border:1px solid var(--line)}
.src{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:700;font-size:15px}
.meta{font-size:12px;color:var(--muted);margin-top:14px}
.meta a{color:inherit}

/* settings */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,100%);background:var(--sheet);z-index:31;transform:translateX(105%);transition:.35s cubic-bezier(.2,.8,.2,1);
  padding:calc(env(safe-area-inset-top) + 18px) 20px 24px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.panel.on{transform:none}
.panel h3{margin:0 0 6px;font-family:Fraunces,Georgia,serif;font-size:26px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;background:var(--chip)}
.row div b{display:block;font-size:15px}.row div span{font-size:12.5px;color:var(--muted)}
.big{width:100%;padding:16px;border-radius:16px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.ghost{width:100%;padding:14px;border-radius:16px;background:var(--chip);font-weight:700}
.toggle{width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{left:23px}
.archive a{display:block;padding:10px 0;color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line);font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.done{position:absolute;inset:0 0 8px 0;border-radius:28px;display:grid;place-items:center;text-align:center;padding:30px;
  background:radial-gradient(circle at 50% 30%,#ff8a5b,#ff5a36 45%,#7c2d12);color:#fff}
.done h2{font-family:Fraunces,Georgia,serif;font-size:34px;margin:10px 0}
.done button{margin-top:18px;background:#fff;color:#111;padding:12px 20px;border-radius:999px;font-weight:800}
@media (min-width:900px){ main{max-width:480px} .card h2{font-size:34px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>Daily Swipe</div>
  <div class="date" id="date">Loading…</div>
  <div class="spacer"></div>
  <button class="iconbtn" id="shuffleQuick" aria-label="Shuffle cards" title="Shuffle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
  </button>
  <button class="iconbtn" id="openSettings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<nav id="tabs" aria-label="Sections"></nav>
<main><div class="deck" id="deck"></div></main>
<footer>
  <button class="nav-btn" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <div class="dots" id="dots"></div>
  <span class="count" id="count"></span>
  <button class="nav-btn" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
</footer>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Story details"></section>

<aside class="panel" id="panel" aria-label="Settings">
  <h3>Settings <button class="iconbtn" id="closeSettings" aria-label="Close">✕</button></h3>
  <button class="big" id="shuffleBtn">🔀 Shuffle the deck</button>
  <button class="ghost" id="resetBtn">Back to original order</button>
  <div class="row"><div><b>Show jokes</b><span>The one-liner under each story</span></div><button class="toggle" id="tJokes" role="switch" aria-checked="true"></button></div>
  <div class="row"><div><b>Show VC angle</b><span>Why it matters for a wealth-builder</span></div><button class="toggle" id="tVc" role="switch" aria-checked="true"></button></div>
  <div class="row"><div><b>Light mode</b><span>Easier in daylight</span></div><button class="toggle" id="tLight" role="switch" aria-checked="false"></button></div>
  <div class="archive"><h4 style="margin:10px 0 4px;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase">Past days</h4><div id="archiveList"><a href="?day=2026-10-24">24 Oct 2026</a></div></div>
  <p style="font-size:12px;color:var(--muted);margin-top:auto">Swipe left for next, right for back. Tap a card to read more. Photos from Unsplash, credited on each card.</p>
</aside>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d){ try{ const v = localStorage.getItem('ds_'+k); return v===null?d:JSON.parse(v);}catch(e){return d} },
    set(k, v){ try{ localStorage.setItem('ds_'+k, JSON.stringify(v)); }catch(e){} }
  };
  const SECTIONS = [["all","All"],["world","World"],["india","India"],["money","Money Desk"]];
  const LABEL = {world:"World", india:"India", money:"Money Desk"};
  let data = null, all = [], order = [], filter = store.get('filter','all'), idx = 0;
  let prefs = { jokes: store.get('jokes', true), vc: store.get('vc', true), light: store.get('light', false) };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = u => /^https:\/\//.test(u||'') ? u : '#';
  function lighten(hex){ // readable accent for sheet text
    const n = parseInt((hex||'#888').slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
    const light = document.documentElement.dataset.theme==='light';
    const mix = light ? 0 : .45; r=Math.round(r+(255-r)*mix); g=Math.round(g+(255-g)*mix); b=Math.round(b+(255-b)*mix);
    return `rgb(${r},${g},${b})`;
  }

  function applyTheme(){
    document.documentElement.dataset.theme = prefs.light ? 'light' : 'dark';
    $('#tLight').setAttribute('aria-checked', prefs.light);
    $('#tJokes').setAttribute('aria-checked', prefs.jokes);
    $('#tVc').setAttribute('aria-checked', prefs.vc);
  }

  function visible(){ return order.map(i => all[i]).filter(s => filter==='all' || s.section===filter); }

  function renderTabs(){
    $('#tabs').innerHTML = SECTIONS.map(([k,l]) => {
      const n = k==='all' ? all.length : all.filter(s=>s.section===k).length;
      return `<button class="chip" data-k="${k}" aria-pressed="${filter===k}">${l}<small>${n}</small></button>`;
    }).join('');
    $('#tabs').querySelectorAll('.chip').forEach(b => b.onclick = () => { filter=b.dataset.k; store.set('filter',filter); idx=0; renderTabs(); renderDeck(); });
  }

  function cardHTML(s, pos){
    const img = s.image && s.image.url;
    return `<article class="card" data-pos="${pos}" style="--c:${esc(s.color||'#333')}">
      <div class="fallback">${esc(s.emoji||'📰')}</div>
      ${img ? `<div class="img" style="background-image:url('${esc(safeUrl(img))}')"></div>` : ''}
      <div class="shade"></div>
      <div class="top"><span class="pill">${esc(LABEL[s.section]||s.section)}</span>${s.stat?`<span class="pill stat">${esc(s.stat)}</span>`:''}</div>
      ${img && s.image.credit ? `<a class="credit" href="${esc(safeUrl(s.image.creditUrl))}" target="_blank" rel="noopener">📷 ${esc(s.image.credit)} / Unsplash</a>`:''}
      <span class="stamp l">NEXT →</span><span class="stamp r">← BACK</span>
      <div class="bottom">
        <div class="kicker"><span class="em">${esc(s.emoji||'')}</span>${esc(s.kicker||'')} · ${esc(s.source||'')}</div>
        <h2>${esc(s.headline)}</h2>
        <p class="dek">${esc((s.body||[])[0]||'')}</p>
        <div class="hint">Tap to read more · swipe for next</div>
      </div>
    </article>`;
  }

  function renderDeck(){
    const list = visible();
    const deck = $('#deck');
    if(!list.length){ deck.innerHTML = `<div class="empty">No stories here today.</div>`; renderDots(list); return; }
    if(idx > list.length) idx = list.length;
    let html = list.map((s,i) => cardHTML(s,i)).join('');
    html += `<div class="done" data-pos="${list.length}" style="display:${idx===list.length?'grid':'none'}"><div><div style="font-size:64px">☕</div><h2>You're all caught up</h2><p>New deck lands every morning.</p><button id="again">Start over</button></div></div>`;
    deck.innerHTML = html;
    const again = $('#again'); if(again) again.onclick = () => { idx=0; layout(); };
    deck.querySelectorAll('.card').forEach(c => {
      const im = c.querySelector('.img');
      if(im){ const url = im.style.backgroundImage.slice(5,-2); const t = new Image(); t.onerror = () => { im.remove(); const cr = c.querySelector('.credit'); if(cr) cr.remove(); }; t.src = url; }
      attachDrag(c);
    });
    layout();
  }

  function layout(){
    const list = visible();
    $('#deck').querySelectorAll('.card').forEach(c => {
      const p = +c.dataset.pos; c.style.transform=''; c.className = 'card';
      if(p < idx) { c.classList.add('hidden'); c.style.transform='translateX(-120%) rotate(-8deg)'; }
      else if(p === idx) { c.style.zIndex = 10; }
      else if(p === idx+1) { c.classList.add('behind'); c.style.zIndex = 9; }
      else if(p === idx+2) { c.classList.add('behind2'); c.style.zIndex = 8; }
      else { c.classList.add('hidden'); c.style.zIndex = 1; }
    });
    const done = $('#deck .done'); if(done) { done.style.display = idx===list.length ? 'grid':'none'; done.style.zIndex = 11; }
    renderDots(list);
  }

  function renderDots(list){
    $('#dots').innerHTML = list.map((_,i)=>`<span class="${i===idx?'on':i<idx?'seen':''}"></span>`).join('');
    $('#count').textContent = list.length ? `${Math.min(idx+1,list.length)}/${list.length}` : '';
  }

  function go(d){
    const n = visible().length; const ni = Math.max(0, Math.min(n, idx + d));
    if(ni !== idx){ idx = ni; layout(); }
  }

  function attachDrag(card){
    let sx=0, sy=0, dx=0, dragging=false, moved=false, id=null;
    card.addEventListener('pointerdown', e => {
      if(+card.dataset.pos !== idx || e.target.closest('a')) return;
      sx=e.clientX; sy=e.clientY; dx=0; dragging=true; moved=false; id=e.pointerId;
    });
    card.addEventListener('pointermove', e => {
      if(!dragging || e.pointerId!==id) return;
      dx = e.clientX - sx; const dy = e.clientY - sy;
      if(!moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){ moved=true; card.classList.add('dragging'); try{card.setPointerCapture(id)}catch(_){} }
      if(moved){
        card.style.transform = `translateX(${dx}px) rotate(${dx/22}deg)`;
        card.querySelector('.stamp.l').style.opacity = dx < -40 ? 1 : 0;
        card.querySelector('.stamp.r').style.opacity = dx > 40 && idx>0 ? 1 : 0;
      }
    });
    const end = e => {
      if(!dragging) return; dragging=false; card.classList.remove('dragging');
      card.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0);
      if(!moved){ return; }
      if(dx < -90) { card.style.transform = 'translateX(-130%) rotate(-12deg)'; setTimeout(()=>go(1), 10); }
      else if(dx > 90 && idx>0) { go(-1); }
      else card.style.transform='';
    };
    card.addEventListener('pointerup', e => { const wasMoved = moved; end(e); if(!wasMoved && +card.dataset.pos===idx && !e.target.closest('a')) openSheet(visible()[idx]); });
    card.addEventListener('pointercancel', end);
  }

  function openSheet(s){
    if(!s) return;
    const sheet = $('#sheet');
    sheet.style.setProperty('--c', s.color||'#555'); sheet.style.setProperty('--c2', lighten(s.color));
    const img = s.image && s.image.url ? `background-image:url('${esc(safeUrl(s.image.url))}')` : '';
    sheet.innerHTML = `
      <div class="hero" style="${img}"><span class="grab"></span><button class="close" aria-label="Close">✕</button></div>
      <div class="content">
        <div class="kicker"><span class="em">${esc(s.emoji)}</span>${esc(LABEL[s.section])} · ${esc(s.kicker)}</div>
        <h3>${esc(s.headline)}</h3>
        ${s.stat?`<div class="statbox"><b>${esc(s.stat)}</b><span>${esc(s.statLabel||'')}</span></div>`:''}
        <ul class="body">${(s.body||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
        ${prefs.jokes && s.joke ? `<div class="box joke"><h4>😏 The quip</h4>${esc(s.joke)}</div>`:''}
        ${prefs.vc && s.vc ? `<div class="box vc"><h4>💼 VC angle</h4>${esc(s.vc)}</div>`:''}
        <a class="src" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">Read at ${esc(s.linkLabel||s.source)} <span>↗</span></a>
        ${s.image&&s.image.credit?`<div class="meta">Photo: <a href="${esc(safeUrl(s.image.creditUrl))}" target="_blank" rel="noopener">${esc(s.image.credit)}</a> on Unsplash. Illustrative, not from the story.</div>`:''}
      </div>`;
    sheet.querySelector('.close').onclick = closeSheet;
    // swipe down on hero to close
    let y0=null; const hero = sheet.querySelector('.hero');
    hero.addEventListener('pointerdown', e=>{y0=e.clientY});
    hero.addEventListener('pointerup', e=>{ if(y0!==null && e.clientY-y0>60) closeSheet(); y0=null; });
    sheet.classList.add('on'); $('#scrim').classList.add('on');
  }
  function closeSheet(){ $('#sheet').classList.remove('on'); if(!$('#panel').classList.contains('on')) $('#scrim').classList.remove('on'); }

  function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),1600); }

  function shuffle(){
    for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
    store.set('order_'+data.date, order); idx=0; renderDeck(); toast('Deck shuffled 🔀');
  }
  function reset(){ order = all.map((_,i)=>i); store.set('order_'+data.date, null); idx=0; renderDeck(); toast('Original order'); }

  // wiring
  $('#prev').onclick = () => go(-1);
  $('#next').onclick = () => go(1);
  $('#shuffleQuick').onclick = shuffle;
  $('#shuffleBtn').onclick = () => { shuffle(); closePanel(); };
  $('#resetBtn').onclick = () => { reset(); closePanel(); };
  const openPanel = () => { $('#panel').classList.add('on'); $('#scrim').classList.add('on'); };
  const closePanel = () => { $('#panel').classList.remove('on'); if(!$('#sheet').classList.contains('on')) $('#scrim').classList.remove('on'); };
  $('#openSettings').onclick = openPanel; $('#closeSettings').onclick = closePanel;
  $('#scrim').onclick = () => { closeSheet(); closePanel(); };
  const tog = (id,key) => $(id).onclick = () => { prefs[key] = !prefs[key]; store.set(key, prefs[key]); applyTheme(); };
  tog('#tJokes','jokes'); tog('#tVc','vc'); tog('#tLight','light');
  document.addEventListener('keydown', e => {
    if(e.key==='ArrowRight') go(1); else if(e.key==='ArrowLeft') go(-1);
    else if(e.key==='Enter' || e.key===' ') { if(!$('#sheet').classList.contains('on')) { e.preventDefault(); openSheet(visible()[idx]); } }
    else if(e.key==='Escape'){ closeSheet(); closePanel(); }
  });

  applyTheme();
  const day = new URLSearchParams(location.search).get('day');
  const src = day && /^\d{4}-\d{2}-\d{2}$/.test(day) ? `archive/${day}.json` : 'news.json';
  fetch(src + '?t=' + Date.now()).then(r => { if(!r.ok) throw 0; return r.json(); }).then(d => {
    data = d; all = d.stories || [];
    const dt = new Date(d.date + 'T00:00:00');
    $('#date').textContent = dt.toLocaleDateString('en-IN',{weekday:'short', day:'numeric', month:'short'}) + (day ? ' · archive' : '');
    const saved = store.get('order_'+d.date, null);
    order = Array.isArray(saved) && saved.length===all.length ? saved : all.map((_,i)=>i);
    if(!SECTIONS.some(([k])=>k===filter)) filter='all';
    renderTabs(); renderDeck();
    fetch('archive/index.json?t='+Date.now()).then(r=>r.ok?r.json():null).then(a=>{
      if(!a||!a.days) return;
      $('#archiveList').innerHTML = (day?`<a href="./">← Today</a>`:'') + a.days.map(x=>`<a href="?day=${esc(x)}">${new Date(x+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</a>`).join('');
    }).catch(()=>{});
  }).catch(() => { $('#deck').innerHTML = `<div class="empty">Couldn't load today's stories. Pull to refresh in a bit.</div>`; $('#date').textContent=''; });
})();
</script>
</body>
</html>
