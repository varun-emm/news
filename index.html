<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Swipe</title>
<meta name="description" content="Varun's daily news: one story at a time, in three cards.">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23ff5a36'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='900'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Playfair+Display:wght@800&family=Anton&family=Space+Grotesk:wght@700&family=DM+Serif+Display&family=Source+Serif+4:opsz,wght@8..60,600&family=Bodoni+Moda:ital,opsz,wght@1,6..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --fg:#f5f5f7; --muted:#8e8e93; --card:#1c1c1e; --card2:#2c2c2e; --line:#38383a;
  --accent:#ff5a36; --save:#ffd60a; --r:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* frame */
.app{position:fixed;inset:0;margin:0 auto;width:100%;max-width:520px;display:flex;flex-direction:column}
@media (min-width:700px){ .app{max-width:440px} }
.bars{display:flex;gap:3px;padding:calc(env(safe-area-inset-top) + 8px) 16px 0}
.bars span{flex:1;height:2px;border-radius:2px;background:#2c2c2e;overflow:hidden;position:relative}
.bars span::after{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .35s}
.bars span.seen::after{transform:scaleX(1);opacity:.45}
.bars span.on::after{transform:scaleX(1)}
header{display:flex;align-items:center;padding:6px 8px 8px 18px;gap:8px}
.date{flex:1;font-size:13px;font-weight:600;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.iconbtn svg{width:21px;height:21px}

/* stage: one story (three cards) at a time */
.stage{position:relative;flex:1;margin:0 12px calc(env(safe-area-inset-bottom) + 12px);perspective:1400px;touch-action:none;user-select:none;-webkit-user-select:none}
.story{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px}
/* the headline card never shrinks; the photo gives way first, then the graphic */
.story > .c-text{flex:none}
.story > .c-photo{flex:1.15 1 0;min-height:88px}
.story > .c-viz{flex:1 1 0;min-height:196px}
.story > .c-done{flex:1}
/* fun stories: one big photo card and a small caption card */
.story > .c-funphoto{flex:1 1 0;min-height:160px}
.c-funphoto .fallback{font-size:110px}
.c-funphoto .img{background-position:center 22%}
.photocredit{position:absolute;right:12px;bottom:10px;z-index:2;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.45);color:rgba(255,255,255,.85);font-size:10.5px;font-weight:600}
.funtag{position:absolute;top:14px;left:14px;z-index:2;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.c{position:relative;min-height:0;border-radius:var(--r);overflow:hidden;cursor:pointer;will-change:transform;backface-visibility:hidden}

/* card: headline on the story's colour */
.c-text{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 88%,white),var(--c) 45%,color-mix(in srgb,var(--c) 80%,black));
  color:#fff;padding:18px 20px 14px;display:flex;flex-direction:column}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75;display:flex;gap:7px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kicker .em{font-size:14px}
.c-text h2{font-size:calc(var(--hs,1) * clamp(21px,6vw,28px));line-height:1.1;margin:10px 0 8px;text-wrap:balance}
/* headline type, picked per story */
.hl-editorial{font-family:Fraunces,Georgia,serif;font-weight:800;letter-spacing:-.02em}
.hl-news{font-family:"Playfair Display",Georgia,serif;font-weight:800;letter-spacing:-.01em}
.hl-impact{--hs:1.12;font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1.04!important}
.hl-tech{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;letter-spacing:-.035em}
.hl-finance{--hs:1.05;font-family:"DM Serif Display",Georgia,serif;font-weight:400;letter-spacing:-.01em}
.hl-serious{--hs:.96;font-family:"Source Serif 4",Georgia,serif;font-weight:600;letter-spacing:-.01em}
.hl-style{--hs:1.06;font-family:"Bodoni Moda",Didot,Georgia,serif;font-style:italic;font-weight:700;letter-spacing:-.01em}
.c-text p{margin:0;font-size:14.5px;line-height:1.42;opacity:.85}
.c-text .acts{margin-top:auto;padding-top:8px;display:flex;justify-content:flex-end;gap:2px}
.acts button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .15s}
.acts button:active{transform:scale(.85)}
.acts svg{width:21px;height:21px}
.acts .save[aria-pressed="true"]{color:var(--save)}
.acts .save[aria-pressed="true"] svg{fill:currentColor}
.acts .save.bump{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}

/* card: photo + the sarcastic line */
.c-photo{background:var(--card)}
.c-photo .img{position:absolute;inset:-3%;background-size:cover;background-position:center}
.story.on .c-photo .img{animation:kenburns 18s ease-out forwards}
.c-photo .fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:72px;
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 55%,white),var(--c) 55%,color-mix(in srgb,var(--c) 55%,black))}
.c-photo .quip{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 16px;color:#fff;font-size:15px;line-height:1.38;font-weight:600;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.78) 60%);opacity:0;transform:translateY(10px)}
.c-photo .quip span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c-photo .quip span::before{content:"😏 "}
.story.on .c-photo .quip{animation:rise .5s .35s cubic-bezier(.2,.8,.2,1) forwards}

/* card: animation + VC line */
.c-viz{container-type:size;background:var(--card);padding:16px 18px 14px;display:flex;flex-direction:column;--a:color-mix(in srgb,var(--c) 45%,white);--up:#30d158;--down:#ff453a}
.vz{flex:1;min-height:0;display:flex;flex-direction:column}
.vz-h{display:flex;align-items:baseline;gap:9px;flex:none;min-width:0}
.vz-h b{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.vz-h span{font-size:12px;color:var(--muted);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vz-b{flex:1;position:relative;margin-top:10px;min-height:44px}
.vz-cap{position:absolute;right:0;bottom:-2px;font-size:10.5px;color:var(--muted);font-weight:600}
.vc{flex:none;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:13px;line-height:1.4;color:#d1d1d6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vc b{margin-right:5px}
/* short animation card: tighter spacing so the graphic keeps its room */
@container (max-height:230px){
  .c-viz .vz-h b{font-size:22px}
  .c-viz .vz-b{margin-top:6px}
  .c-viz .vc{-webkit-line-clamp:2;margin-top:8px;padding-top:8px}
  .c-viz .vz-word{gap:2px}.c-viz .vz-word .em{font-size:30px}.c-viz .vz-word b{font-size:20px}
}
/* line chart that draws itself */
.vz-line{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.vz-line .ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.vz-line .ar{opacity:0}
.story.on .vz-line .ln{animation:draw 1.4s cubic-bezier(.4,0,.2,1) .2s forwards}
.story.on .vz-line .ar{animation:fadein .8s ease 1.1s forwards}
.vz-end{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:currentColor;opacity:0}
.story.on .vz-end{animation:fadein .2s 1.6s forwards,ping 1.6s 1.7s ease-out infinite}
/* columns (compare, before/after, money) */
.vz-cols{position:absolute;inset:0 0 14px;display:flex;align-items:flex-end;justify-content:center;gap:12px}
.vz-col{position:relative;flex:1;max-width:76px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.vz-col i{display:block;width:100%;height:var(--h);border-radius:8px 8px 3px 3px;background:var(--card2);transform:scaleY(0);transform-origin:bottom}
.vz-col.hi i{background:var(--a)}
.vz-col small{font-size:11.5px;font-weight:800;opacity:0}
.vz-col em{position:absolute;bottom:-15px;font-style:normal;font-size:10.5px;color:var(--muted)}
.story.on .vz-col i{animation:grow .9s cubic-bezier(.2,.9,.2,1.05) calc(.2s + var(--d,0s)) forwards}
.story.on .vz-col small{animation:fadein .4s calc(.85s + var(--d,0s)) forwards}
.vz-cols.money{gap:6px}.vz-cols.money .vz-col{max-width:none}
/* horizontal "1x vs 22x" */
.vz-rows{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
.vz-row{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:10px;font-size:12px;font-weight:700}
.vz-row i{display:block;height:20px;border-radius:6px;background:var(--card2);width:var(--w);transform:scaleX(0);transform-origin:left}
.vz-row.hi i{background:var(--a)}
.story.on .vz-row i{animation:growx 1.2s cubic-bezier(.2,.9,.2,1) calc(.25s + var(--d,0s)) forwards}
/* calendar */
.vz-cal{position:absolute;inset:0;display:flex;align-items:center;gap:16px;perspective:600px}
.vz-cal .pg{width:72px;flex:none;border-radius:14px;overflow:hidden;background:#fff;color:#111;text-align:center;transform-origin:top;transform:rotateX(-95deg)}
.vz-cal .pg div{background:#ff453a;color:#fff;font-size:11px;font-weight:800;letter-spacing:.12em;padding:4px 0}
.vz-cal .pg b{display:block;font-size:32px;font-weight:800;padding:2px 0 6px;letter-spacing:-.03em}
.vz-cal p{margin:0;font-size:13px;color:var(--muted);opacity:0}
.vz-cal p strong{display:block;font-size:24px;color:var(--fg);letter-spacing:-.02em}
.story.on .vz-cal .pg{animation:flip .8s cubic-bezier(.2,1.3,.4,1) .2s forwards}
.story.on .vz-cal p{animation:rise .5s .75s forwards}
/* unit dots */
.vz-dots{position:absolute;inset:0 0 14px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:var(--g,5px)}
.vz-dots i{width:var(--s,10px);height:var(--s,10px);border-radius:50%;background:var(--a);opacity:0;transform:scale(0)}
.calm .vz-dots i{background:#aeaeb2}
.story.on .vz-dots i{animation:popin .35s cubic-bezier(.2,1.6,.4,1) calc(.2s + var(--d)) forwards}
/* a word, not a number */
.vz-word{justify-content:center;align-items:center;text-align:center;gap:6px}
.vz-word .em{font-size:40px;line-height:1;opacity:0;transform:scale(.4)}
.vz-word b{font-size:24px;font-weight:800;letter-spacing:-.02em;opacity:0}
.vz-word span{font-size:12px;color:var(--muted);opacity:0}
.story.on .vz-word .em{animation:popin .6s cubic-bezier(.2,1.6,.4,1) .15s forwards}
.story.on .vz-word b{animation:rise .5s .45s forwards}
.story.on .vz-word span{animation:rise .5s .6s forwards}

.c-done{display:grid;place-items:center;text-align:center;padding:30px;background:var(--card)}
.c-done h2{font-family:Fraunces,Georgia,serif;font-size:30px;margin:10px 0 6px}
.c-done p{color:var(--muted);margin:0}
.pillbtn{margin:18px 4px 0;padding:13px 20px;border-radius:999px;background:var(--fg);color:#000;font-weight:700}
.pillbtn.alt{background:var(--card2);color:var(--fg)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.heart{position:fixed;font-size:84px;transform:translate(-50%,-50%);animation:heart .9s ease-out forwards;pointer-events:none;z-index:50}

/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92dvh;background:var(--card);border-radius:var(--r) var(--r) 0 0;
  transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.85,.2,1);z-index:21;overflow:hidden;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .hero{position:relative;height:200px;flex:none;background:var(--c) center/cover}
.sheet .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,var(--card))}
.sheet .close{position:absolute;top:14px;right:14px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
.sheet .grab{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:5px;border-radius:5px;background:rgba(255,255,255,.6);z-index:2}
.sheet .content{overflow-y:auto;padding:0 22px calc(env(safe-area-inset-bottom) + 28px);margin-top:-36px;position:relative;z-index:1}
.sheet .kicker{color:var(--c2);opacity:1}
.sheet h3{font-size:calc(var(--hs,1) * 27px);line-height:1.12;margin:8px 0 16px;letter-spacing:-.02em}
.sheet ul{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:12px}
.sheet li{font-size:16px;line-height:1.5;padding-left:18px;position:relative}
.sheet li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--c2)}
.box{border-radius:18px;padding:14px 16px;margin-bottom:10px;font-size:15px;line-height:1.5;background:var(--card2)}
.box h4{margin:0 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.src{display:flex;justify-content:space-between;margin-top:14px;padding:15px 18px;border-radius:16px;background:var(--fg);color:#000;text-decoration:none;font-weight:700}
.meta{font-size:12px;color:var(--muted);margin-top:14px}
.meta a{color:inherit}

/* settings */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(370px,100%);background:#111;z-index:31;transform:translateX(105%);transition:.38s cubic-bezier(.2,.85,.2,1);
  padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.panel.on{transform:none}
.panel h3{margin:0 0 4px;font-family:Fraunces,Georgia,serif;font-size:26px;display:flex;justify-content:space-between;align-items:center}
.group{background:var(--card);border-radius:18px;overflow:hidden;flex:none}
.group > a,.group > button,.group summary{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;font-size:15px;text-align:left;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
.group > :last-child{border-bottom:0}
.group small{color:var(--muted);font-size:13px}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:8px 4px 0}
.morebtn{flex:none;width:100%;padding:16px;border-radius:18px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.morebtn[disabled]{opacity:.65}
.status{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
.status a{color:var(--fg)}
nav{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:var(--card);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);color:#000}
.chip small{opacity:.55;margin-left:4px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translateX(-50%) translateY(10px);background:#2c2c2e;color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:40;pointer-events:none;text-align:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%)}

@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-2%,-2%)}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes growx{to{transform:scaleX(1)}}
@keyframes flip{to{transform:rotateX(0)}}
@keyframes popin{to{opacity:1;transform:scale(1)}}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 70%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes heart{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-12deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(6deg)}60%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-110%) scale(1.1)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .vz *,.c-photo .quip{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="bars" id="bars"></div>
  <header>
    <div class="date" id="date">Loading…</div>
    <button class="iconbtn" id="openSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Story details"></section>

<aside class="panel" id="panel" aria-label="Settings">
  <h3>Daily Swipe <button class="iconbtn" id="closeSettings" aria-label="Close">✕</button></h3>
  <button class="morebtn" id="moreBtn">＋ More news</button>
  <div class="status" id="moreStatus"></div>
  <div class="label">Show</div>
  <nav id="tabs" aria-label="Show"></nav>
  <div class="label">Deck</div>
  <div class="group">
    <button id="shuffleBtn">Shuffle the deck <small>🔀</small></button>
    <button id="resetBtn">Original order <small>↺</small></button>
  </div>
  <div class="label">Past days</div>
  <div class="group" id="archiveList"></div>
  <p style="font-size:12px;color:var(--muted);margin:auto 4px 0">Swipe up for the next story, down to go back. Tap a card to read the full story, double-tap to save. Photos from Unsplash.<br><br><span id="version"></span></p>
</aside>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d){ try{ const v = localStorage.getItem('ds_'+k); return v===null?d:JSON.parse(v);}catch(e){return d} },

  };
  const SECTIONS = [["all","All"],["world","World"],["india","India"],["money","Money Desk"],["saved","🔖 Saved"]];
  const LABEL = {world:"World", india:"India", money:"Money Desk"};
  const VERSION = '2.5'; // bump on every change to this page, so it's easy to tell which copy you have
  const motionOK = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = $('#stage');
  let data = null, all = [], order = [], list = [], idx = 0, filter = 'all', dateText = '', isArchive = false;
  let saved = store.get('saved', []); if(!Array.isArray(saved)) saved = [];

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = u => /^https:\/\//.test(u||'') ? u : '#';
  const FUN = {
    fashion: {label:'Style', emoji:'👔', font:'style'},
    good:    {label:'Good news', emoji:'🌈', font:'editorial'},
    release: {label:'Record release', emoji:'🚀', font:'impact'}
  };
  const isFun = s => !!FUN[s.type];

  let fun = [];
  function lighten(hex){

  // ---- saving ----
  const isSaved = s => saved.some(x => x.id === s.id);
  function toggleSave(s){

    renderTabs(); toast(on ? 'Removed from saved' : 'Saved 🔖');
  }

  function visible(){

    return filter === 'all' ? withFun(news) : news;
  }
  // drop a fun story in after every 3rd, 4th or 6th news story; the gaps are fixed for the day
  function withFun(news){
    if(!fun.length) return news;

    const out = []; let k = 0, next = gap();
    news.forEach(s => { out.push(s); if(--next === 0){ if(k < fun.length) out.push(fun[k++]); next = gap(); } });
    return out;
  }
  function renderTabs(){
    $('#tabs').innerHTML = SECTIONS.map(([k,l]) => {
      const n = k==='all' ? all.length : k==='saved' ? saved.length : all.filter(s=>s.section===k).length;

    }).join('');
    $('#tabs').querySelectorAll('.chip').forEach(b => b.onclick = () => { filter = b.dataset.k; renderTabs(); show(0, 1, true); closePanel(); });
    const f = SECTIONS.find(([k]) => k === filter);
    $('#date').textContent = dateText + (filter !== 'all' && f ? ' · ' + f[1].replace('🔖 ','') : '');
  }

  // ---- the animated graphic: picked from the story's stat ----
  const nums = t => (String(t).match(/\d[\d,]*(?:\.\d+)?/g) || []).map(n => parseFloat(n.replace(/,/g,'')));
  const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  function vizKind(s){
    const t = String(s.stat||'').trim(), n = nums(t);
    if(s.fx) return s.fx;
    if(/\bvs\.?\b/i.test(t) && n.length >= 2) return 'compare';
    if(/→|->/.test(t) && n.length >= 2) return 'fromto';
    if(/^[-−]|↓/.test(t)) return 'trend-down';
    if(/^\+|↑/.test(t)) return 'trend-up';
    if(/^\d+(\.\d+)?\s*x$/i.test(t)) return 'multiple';
    if(/^[$₹€£]/.test(t) && n.length) return 'money';
    if(/^[a-z]{3,9}\.?\s+\d{1,2}$/i.test(t) && MONTHS.includes(t.slice(0,3).toLowerCase())) return 'date';

  function trendSVG(s, up){
    const rnd = seeded(s.id||s.headline), N = 11, pts = [];
    for(let i=0;i<N;i++){ const k = i/(N-1), base = up ? 88 - k*72 : 14 + k*72; pts.push([4 + k*292, Math.max(8, Math.min(92, base + (rnd()-.5)*(i===N-1?0:24)))]); }

        <path class="ar" d="${d} L296,100 L4,100 Z" fill="url(#${gid})"/><path class="ln" d="${d}" pathLength="1" style="stroke:${col}"/>

  }

  // ---- one story = three cards, in a shuffled order ----
  const ICON = {

  }

    const img = s.image && s.image.url, on = isSaved(s);
    const cards = {
      text: `<article class="c c-text">

          <h2 class="hl-${headFont(s)}">${esc(s.headline)}</h2>

        </article>`,

    };

    el.dataset.id = s.id;
    el.style.setProperty('--c', s.color || '#333');
    el.innerHTML = kinds.map(k => cards[k]).join('');

    return el;
  }
  function doneEl(){
    const el = document.createElement('div'); el.className = 'story';
    el.innerHTML = `<article class="c c-done"><div><div style="font-size:56px">☕</div><h2>You're all caught up</h2><p>${list.length} stories so far today.</p>
      ${isArchive || filter === 'saved' || remaining() <= 0 ? '' : `<button class="pillbtn" data-act="more">＋ ${Math.min(BATCH, remaining())} more stories</button>`}<button class="pillbtn alt" data-act="again">Start over</button></div></article>`;
    return el;
  }

  // ---- transitions: a random one each swipe ----
  const rand = (a, b) => a + Math.random() * (b - a);
  const FX = {

    zoom:    { out:()=>`scale(.78)`,                                                 in:()=>`scale(1.14)`, stagger:40, fade:true },
    scatter: { out:(i,d)=>`translate(${rand(-70,70)}%,${-d*rand(90,140)}%) rotate(${rand(-28,28)}deg)`, in:(i,d)=>`translate(${rand(-50,50)}%,${d*rand(60,110)}%) rotate(${rand(-22,22)}deg)`, stagger:45 },
    cascade: { out:()=>`translateX(-115%) rotate(-4deg)`,                            in:()=>`translateX(115%) rotate(4deg)`, stagger:80 },
    turn:    { out:()=>`rotateY(-90deg)`,                                            in:()=>`rotateY(90deg)`, stagger:70, fade:true, origin:['0% 50%','100% 50%'] },
    drop:    { out:(i,d)=>`translateY(${-d*20}%) scale(.6)`,                         in:(i,d)=>`translateY(${-d*130}%) rotate(${rand(-6,6)}deg)`, stagger:90, fade:true }
  };

  }

  const current = () => stage.querySelector('.story:not(.leaving)');

        {duration: 360, delay: j * fx.stagger, easing: 'cubic-bezier(.55,0,.8,.3)', fill: 'forwards'});

      if(fx.origin) c.style.transformOrigin = fx.origin[1];

        {duration: 560, delay: 150 + j * fx.stagger, easing: 'cubic-bezier(.18,.9,.25,1.12)', fill: 'backwards'});
      a.onfinish = () => { c.style.transformOrigin = ''; if(++finished === inCards.length){ next.classList.add('on'); countUp(next); busy = false; } };
    });
  }
  function go(d){ if(busy) return; const p = idx + d; if(p < 0 || p > list.length) return bounce(d); show(p, d); }
  function bounce(d){

    [...cur.children].forEach((c, i) => c.animate([{transform:'none'},{transform:`translateY(${-d*(14 - i*3)}px)`},{transform:'none'}], {duration: 380, delay: i*30, easing:'ease-out'}));
  }
  function renderBars(){ $('#bars').innerHTML = list.map((_,i)=>`<span class="${i===idx?'on':i<idx?'seen':''}"></span>`).join(''); }

  // count numeric stats up from zero
  function countUp(root){
    const el = root.querySelector('[data-stat]');
    if(!el || !motionOK) return;

    if(!m) return;
    const target = parseFloat(m[2].replace(/,/g,'')), dec = (m[2].split('.')[1]||'').length, comma = m[2].includes(','), t0 = performance.now();

  }

  // ---- gestures: drag the cards, release to fly ----

      const a = act.dataset.act;
      if(a === 'save') toggleSave(s);
      else if(a === 'share') share(s);
      else if(a === 'more') moreNews();
      else if(a === 'again') show(0, -1);
      return;
    }
    if(!s || idx >= list.length) return;
    const now = Date.now();
    if(now - lastTap < 300){ // double-tap saves
      clearTimeout(tapTimer); lastTap = 0;
      const h = document.createElement('span'); h.className = 'heart'; h.textContent = '🔖';
      h.style.left = e.clientX + 'px'; h.style.top = e.clientY + 'px';
      h.addEventListener('animationend', () => h.remove()); document.body.appendChild(h);
      if(!isSaved(s)) toggleSave(s); else toast('Already saved 🔖');
      return;
    }
    lastTap = now;
    tapTimer = setTimeout(() => openSheet(s), 290);
  }

  let wheelLock = 0, wheelSum = 0;
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    if(busy || Date.now() < wheelLock) return;
    wheelSum += e.deltaY;
    if(Math.abs(wheelSum) > 50){ const d = Math.sign(wheelSum); wheelSum = 0; wheelLock = Date.now() + 700; go(d); }
  }, {passive:false});

  async function share(s){
    const url = location.origin + location.pathname + `?day=${encodeURIComponent((s.id||'').slice(0,10))}#${encodeURIComponent(s.id)}`;
    try{
      if(navigator.share) { await navigator.share({title: s.headline, text: s.headline, url}); return; }
      await navigator.clipboard.writeText(url); toast('Link copied 🔗');
    }catch(e){ if(e && e.name !== 'AbortError') toast('Could not share'); }
  }

  // ---- full story sheet ----
  function openSheet(s){
    const sheet = $('#sheet');
    sheet.style.setProperty('--c', s.color||'#555'); sheet.style.setProperty('--c2', lighten(s.color));
    const img = s.image && s.image.url ? `background-image:url('${esc(safeUrl(s.image.url))}')` : '';
    sheet.innerHTML = `
      <div class="hero" style="${img}"><span class="grab"></span><button class="close" aria-label="Close">✕</button></div>
      <div class="content">
        <div class="kicker"><span class="em">${esc(s.emoji)}</span>${esc(LABEL[s.section] || (isFun(s) ? FUN[s.type].label : ''))} · ${esc(s.kicker || s.source || '')}</div>
        <h3 class="hl-${headFont(s)}">${esc(s.headline)}</h3>
        <ul>${(s.body||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
        ${s.stat?`<div class="box"><h4>📊 ${esc(s.statLabel||'The number')}</h4><b style="font-size:22px">${esc(s.stat)}</b></div>`:''}
        ${s.joke?`<div class="box"><h4>😏 The quip</h4><i>${esc(s.joke)}</i></div>`:''}
        ${s.vc?`<div class="box"><h4>💼 VC angle</h4>${esc(s.vc)}</div>`:''}
        <a class="src" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">Read at ${esc(s.linkLabel||s.source)} <span>↗</span></a>
        ${s.image&&s.image.credit?`<div class="meta">Photo: <a href="${esc(safeUrl(s.image.creditUrl))}" target="_blank" rel="noopener">${esc(s.image.credit)}</a>${s.image.preview ? ", the article's own preview image. © the publisher." : ' on Unsplash. Illustrative, not from the story.'}</div>`:''}
      </div>`;
    sheet.querySelector('.close').onclick = closeSheet;
    let y0 = null; const hero = sheet.querySelector('.hero');
    hero.addEventListener('pointerdown', e => { y0 = e.clientY; });
    hero.addEventListener('pointerup', e => { if(y0 !== null && e.clientY - y0 > 60) closeSheet(); y0 = null; });
    sheet.classList.add('on'); $('#scrim').classList.add('on');
  }
  function closeSheet(){ $('#sheet').classList.remove('on'); if(!$('#panel').classList.contains('on')) $('#scrim').classList.remove('on'); }
  const openPanel = () => { $('#panel').classList.add('on'); $('#scrim').classList.add('on'); };
  const closePanel = () => { $('#panel').classList.remove('on'); if(!$('#sheet').classList.contains('on')) $('#scrim').classList.remove('on'); };
  function toast(t, ms){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'), ms || 1700); }

  // ---- shuffle ----
  function shuffle(){
    for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
    store.set('order_'+data.date, order); if(filter==='saved') filter='all'; renderTabs(); show(0, 1); toast('Deck shuffled 🔀');
  }
  function reset(){ order = all.map((_,i)=>i); store.set('order_'+data.date, null); show(0, -1); toast('Original order'); }

  // ---- More news: the nightly run leaves extra stories in more.json; each tap adds the next few ----
  const BATCH = 5;
  let extras = [];
  const revealedKey = () => 'revealed_' + data.date;
  function remaining(){ return extras.length - store.get(revealedKey(), 0); }
  function renderMore(){
    const left = isArchive ? 0 : remaining();
    $('#moreBtn').disabled = left <= 0;
    $('#moreBtn').textContent = left > 0 ? `＋ More news (${left} left)` : 'No more news today';
    $('#moreStatus').textContent = isArchive ? "More news works on today's deck" : left > 0 ? `Adds ${Math.min(BATCH, left)} stories at a time` : 'New stories land every morning around 4 AM';
  }
  // add extras[from .. to) to the deck
  function addExtras(to){
    const from = all.filter(s => extras.includes(s)).length;
    for(let i = from; i < to; i++){ all.push(extras[i]); order.push(all.length - 1); }
    store.set(revealedKey(), Math.max(store.get(revealedKey(), 0), to));
    return to - from;
  }
  function moreNews(){
    if(isArchive || remaining() <= 0){ toast(isArchive ? "More news works on today's deck" : "That's all for today. More at 4 AM ☕", 2500); return; }
    const firstId = extras[store.get(revealedKey(), 0)].id;
    const added = addExtras(store.get(revealedKey(), 0) + Math.min(BATCH, remaining()));
    store.set('order_'+data.date, order);
    if(filter !== 'all') filter = 'all';
    renderTabs(); renderMore(); closePanel();
    toast(`${added} more stories ✨`, 2200);
    show(visible().findIndex(s => s.id === firstId), 1);
  }
  // fun stories: today's from fun.json, a past day's from archive/<date>-fun.json; types are mixed so two of a kind don't follow each other
  async function loadFun(){
    try{
      const r = await fetch((isArchive ? `archive/${data.date}-fun.json` : 'fun.json') + '?t=' + Date.now()); if(!r.ok) return;
      const m = await r.json();
      if(!m || m.date !== data.date || !Array.isArray(m.items)) return;
      const groups = {};
      m.items.filter(x => x && x.id && x.headline && FUN[x.type]).forEach(x => (groups[x.type] = groups[x.type] || []).push(x));
      const types = Object.keys(groups), rnd = seeded(data.date + '-mix');
      for(let i=types.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [types[i],types[j]]=[types[j],types[i]]; }
      fun = [];
      for(let n = 0; types.some(t => groups[t][n]); n++) types.forEach(t => { if(groups[t][n]) fun.push(groups[t][n]); });
    }catch(e){}
  }
  async function loadExtras(){
    try{
      const r = await fetch('more.json?t=' + Date.now()); if(!r.ok) return;
      const m = await r.json();
      if(m && m.date === data.date && Array.isArray(m.stories)) extras = m.stories.filter(s => s && s.id && s.headline);
    }catch(e){}
  }

  $('#version').textContent = `Daily Swipe v${VERSION}`;

  // ---- wiring ----
  $('#moreBtn').onclick = moreNews;
  $('#shuffleBtn').onclick = () => { shuffle(); closePanel(); };
  $('#resetBtn').onclick = () => { reset(); closePanel(); };
  $('#openSettings').onclick = openPanel; $('#closeSettings').onclick = closePanel;
  $('#scrim').onclick = () => { closeSheet(); closePanel(); };
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ closeSheet(); closePanel(); return; }
    if($('#sheet').classList.contains('on') || $('#panel').classList.contains('on') || e.target.tagName === 'INPUT') return;
    if(['ArrowDown','ArrowRight','j',' '].includes(e.key)){ e.preventDefault(); go(1); }
    else if(['ArrowUp','ArrowLeft','k'].includes(e.key)){ e.preventDefault(); go(-1); }
    else if(e.key === 'Enter' && list[idx]) openSheet(list[idx]);
    else if(e.key === 's' && list[idx]) toggleSave(list[idx]);
  });

  // ---- load ----
  const day = new URLSearchParams(location.search).get('day');
  const hash = decodeURIComponent(location.hash.slice(1));
  const src = day && /^\d{4}-\d{2}-\d{2}$/.test(day) ? `archive/${day}.json` : 'news.json';
  const load = u => fetch(u + '?t=' + Date.now()).then(r => { if(!r.ok) throw 0; return r.json(); });
  isArchive = src !== 'news.json';
  // a shared link for today's deck points at ?day=<today>, which only exists as news.json until tomorrow
  load(src).catch(() => src === 'news.json' ? Promise.reject() : load('news.json').then(d => { isArchive = false; return d.date === day ? d : Promise.reject(); }))
  .then(async d => {
    data = d; all = (d.stories || []).slice(); order = all.map((_,i)=>i);
    dateText = new Date(d.date + 'T00:00:00').toLocaleDateString('en-IN',{weekday:'short', day:'numeric', month:'short'}) + (isArchive ? ' · archive' : '');
    const savedOrder = store.get('order_'+d.date, null);
    if(!isArchive){
      await loadExtras();
      const shared = extras.findIndex(s => s.id === hash); // a shared link to an extra story reveals up to it
      addExtras(Math.min(extras.length, Math.max(store.get(revealedKey(), 0), shared + 1)));
    }
    if(Array.isArray(savedOrder) && savedOrder.length === all.length) order = savedOrder;
    await loadFun();
    renderTabs(); renderMore();
    const start = hash ? Math.max(0, visible().findIndex(s => s.id === hash)) : 0;
    show(start, 1, true);
    if(!store.get('hinted', false)){ store.set('hinted', true); setTimeout(() => toast('Swipe up for the next story · tap to read', 3000), 700); }
    fetch('archive/index.json?t='+Date.now()).then(r=>r.ok?r.json():null).then(a=>{
      if(!a||!a.days) return;
      $('#archiveList').innerHTML = (isArchive?`<a href="./">← Today <small>›</small></a>`:'') + a.days.map(x=>`<a href="?day=${esc(x)}">${new Date(x+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})} <small>›</small></a>`).join('');
    }).catch(()=>{});
  }).catch(() => { stage.innerHTML = `<div class="empty">Couldn't load today's stories. Try again in a bit.</div>`; $('#date').textContent=''; });
})();
</script>
</body>
</html>
