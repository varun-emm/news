name: More news

# Started by the "More news" button in the site's settings.
on:
  workflow_dispatch:
    inputs:
      count:
        description: How many extra stories to add (1-10)
        default: "5"

permissions:
  contents: write

concurrency:
  group: more-news
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic==2.3.0
      - name: Research and write more.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNT: ${{ inputs.count }}
        run: python scripts/more_news.py
      - name: Commit and push
        run: |
          git config user.name "daily-swipe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add more.json
          git diff --cached --quiet && exit 0
          git commit -m "More news $(TZ=Asia/Kolkata date +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
